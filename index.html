<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve Online Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Navigation Bar with Top-Right Login -->
    <nav class="top-nav">
        <div class="nav-links">
            <button class="nav-link active" data-target="command-deck">COMMAND DECK</button>
            <button class="nav-link" data-target="my-characters">MY CHARACTERS</button>
            <a class="nav-link" href="fits.html">FITS</a>
            <a class="nav-link" href="https://zkillboard.com/" target="_blank">ZKILLBOARD</a>
        </div>

        <div class="nav-auth">
            <span id="pilot-info">Not logged in</span>
            <button id="login-btn">Log In with EVE</button>
        </div>
    </nav>

    <div class="container">
        <!-- PAGE 1: COMMAND DECK -->
        <div id="command-deck" class="page-view active-view">
            <h1>Command Deck</h1>

            <div class="card">
                <h2>Tranquility Server Status</h2>
                <p id="server-status">Fetching from ESI...</p>
                <p id="player-count"></p>
            </div>

            <div class="card">
                <h2>Plex Market Tracker (Global Average)</h2>
                <p id="plex-price">Loading market Data...</p>
                <button id="refresh-btn">Refresh Data</button>
            </div>
        </div>

        <!-- PAGE 2: MY CHARACTERS (Assets & Industry) -->
        <div id="my-characters" class="page-view">
            <h1>My Characters & Assets</h1>

            <div class="card">
                <h2>Pilot Assets & Materials</h2>
                <ul id="asset-list">
                    <li>Use the "Log In with EVE" button in the top right to view your hangar assets.</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
